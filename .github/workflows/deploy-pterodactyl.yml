name: Deploy to Pterodactyl

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pterodactyl-impulse-reforged
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install SFTP client library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-paramiko
      - name: Upload gamemode files
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.SFTP_HOST_KEY_SHA256 }}
        run: /usr/bin/python3 .github/scripts/deploy_sftp.py
